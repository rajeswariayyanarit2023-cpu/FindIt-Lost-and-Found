{% extends 'base.html' %}

{% block title %}Delete: {{ item.name }} – FindIt{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="form-card">
                <div class="delete-warning">
                    <i class="bi bi-exclamation-triangle-fill d-block"></i>
                    <h3 class="fw-bold mb-2">Delete Item Report?</h3>
                    <p class="text-muted mb-3">
                        Are you sure you want to delete <strong>"{{ item.name }}"</strong>?
                        This action cannot be undone. All associated claims will also be deleted.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="bi bi-trash me-1"></i>Yes, Delete
                            </button>
                            <a href="{% url 'item_detail' pk=item.pk %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
